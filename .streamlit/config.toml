[server]
maxUploadSize        = 50
headless             = true
enableCORS           = true
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base                   = "dark"
backgroundColor        = "#0a0a0f"
secondaryBackgroundColor = "#13131a"
textColor              = "#e2e8f0"
primaryColor           = "#7c6fcd"
font                   = "sans serif"
