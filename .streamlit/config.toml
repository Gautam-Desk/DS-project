# ============================================================
#  Streamlit Cloud Deployment Config
#  This file MUST be named: .streamlit/config.toml
# ============================================================

[server]
maxUploadSize = 50          # MB — max file upload size
headless      = true        # Required for cloud deployment
enableCORS    = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false    # Disable telemetry

[theme]
base            = "dark"
backgroundColor = "#0f0c29"
secondaryBackgroundColor = "#1a1a2e"
textColor       = "#e2e8f0"
font            = "sans serif"
